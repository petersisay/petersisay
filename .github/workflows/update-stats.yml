name: Auto-Sync GitHub Profile Stats

on:
  schedule:
    # Runs every 3 hours automatically
    - cron: '0 */3 * * *'
  workflow_dispatch: # Allows 1-click manual trigger anytime from GitHub Actions tab
  push:
    branches:
      - main
    paths-ignore:
      - 'assets/**'
      - '.github/**'

permissions:
  contents: write

jobs:
  update-profile-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Profile Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch Fresh GitHub Activity & Stats SVGs
        run: |
          node scripts/fetch-stats.js

      - name: Commit and Push Updated Stats
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/
          if git diff --staged --quiet; then
            echo "No stats changes detected. Skipping commit."
          else
            git commit -m "chore(stats): auto-sync live GitHub profile stats and streak [skip ci]"
            git push
          fi
