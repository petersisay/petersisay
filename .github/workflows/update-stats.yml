name: Auto-Sync GitHub Profile Stats

on:
  schedule:
    # Runs automatically every hour to keep profile stats and streak fresh
    - cron: '0 * * * *'
  workflow_dispatch: # Allows 1-click manual trigger anytime from GitHub Actions tab
  repository_dispatch: # Allows external repositories (e.g. TemariHub, CodeTogether, lehulu) to trigger sync on push
    types: [activity_update, push_update, sync_profile]
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-profile-stats:
    # Prevent bot from triggering recursive runs
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Profile Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch Fresh GitHub Activity & Stats SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/fetch-stats.js

      - name: Commit and Push Updated Stats
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/
          if git diff --staged --quiet; then
            echo "✓ All stats are already up to date. No changes needed."
          else
            git commit -m "chore(stats): auto-sync live GitHub profile stats and streak [skip ci]"
            git pull --rebase origin main || true
            git push origin main
            echo "✓ Successfully pushed updated SVG stats to repository."
          fi
