<svg xmlns='http://www.w3.org/2000/svg'
    xmlns:xlink='http://www.w3.org/1999/xlink'
    viewBox='0 0 850 56'
    style='background-color: #00000000;'
    width='850px' height='56px'>

    <style>
        .typing-text {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Fira Code', monospace, sans-serif;
            font-weight: 700;
            font-size: 22px;
            fill: #38BDF8;
            dominant-baseline: middle;
            text-anchor: middle;
            letter-spacing: 0.5px;
        }
    </style>

    <path id='path0'>
